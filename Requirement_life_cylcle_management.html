<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm Requirements Life Cycle Management</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#5f6b7d;--bd:#d9dee6;--ac:#2f5fd0;--ok:#1a7f4b;--okbg:#e4f6ec;--no:#c0392b;--nobg:#fdeae7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e222b;--tx:#e8ebf0;--mut:#9aa5b6;--bd:#333a47;--ac:#6f96f0;--ok:#4cc987;--okbg:#17362a;--no:#f0796b;--nobg:#3d201c}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e222b;--tx:#e8ebf0;--mut:#9aa5b6;--bd:#333a47;--ac:#6f96f0;--ok:#4cc987;--okbg:#17362a;--no:#f0796b;--nobg:#3d201c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.prog{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.cnt{font-size:.85rem;color:var(--mut);margin-top:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.card.ok{border-color:var(--ok)}.card.no{border-color:var(--no)}
.qh{font-weight:600;margin:0 0 10px;white-space:pre-line}
.qh small{color:var(--mut);font-weight:400}
label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label:hover{border-color:var(--ac)}
input{margin-top:5px;accent-color:var(--ac)}
.locked label{cursor:default}
label.right{background:var(--okbg);border-color:var(--ok)}
label.wrong{background:var(--nobg);border-color:var(--no)}
.tag{margin-left:auto;font-size:.8rem;font-weight:600;white-space:nowrap}
.right .tag{color:var(--ok)}.wrong .tag{color:var(--no)}
.res{margin-top:10px;font-weight:600}
.ok .res{color:var(--ok)}.no .res{color:var(--no)}
.exp{margin-top:6px;color:var(--mut);font-size:.92rem}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
button{font:inherit;border:0;border-radius:8px;padding:11px 22px;background:var(--ac);color:#fff;cursor:pointer;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#score{display:none;text-align:center;font-size:1.3rem;font-weight:700}
#score span{display:block;font-size:2.2rem;color:var(--ac)}
</style></head><body><div class="wrap">
<h1>Trắc nghiệm: Requirements Life Cycle Management</h1>
<p class="sub">Chọn một đáp án cho mỗi câu, sau đó bấm Nộp bài để xem kết quả.</p>
<div class="bar"><div class="prog"><i id="pb"></i></div><div class="cnt" id="cnt"></div></div>
<div id="score" class="card"></div>
<div id="list"></div>
<div class="actions"><button id="sub" disabled>Nộp bài</button><button id="rst" class="sec" style="display:none">Làm lại</button><span id="hint" class="sub" style="margin:0"></span></div>
</div>
<script>
var Q=[{"n": "5", "q": "In a marketing campaign, the team is tasked with creating 50 promotional materials, such as social media posts, ads, and email templates, for an upcoming product launch. The team decides to plan the delivery of materials using sprints. They estimate that they can only produce about 10 materials a sprint. The project sponsor needs the work to be delivered in full eventually. What is likely to happen?", "o": ["Escalations to management", "Project is cancelled", "Backlog is created", "Project delays and overtime work"], "k": 2, "e": "A backlog occurs when the volume of work items to be completed exceeds the capacity to complete them. BABOK 10.2 Backlog management Other outcomes even though possible, are not guaranteed to happen."}, {"n": "6", "q": "During backlog prioritization, the Product Owner realized that a particular user story lacks details. In order to get more infromation, she tried to:\n\n\n\nhowever, she could not find any of this information.\n\nWhich aspect of requirements management was not implemented here?", "o": ["understand the stakeholders of that user story", "understand which business priority it supports", "Requirements change management", "Requirements allocation", "Requirements release", "Requirements traceability"], "k": 3, "e": "Requirements traceability identifies and documents the lineage of each requirement, including its backward traceability, its forward traceability, and its relationship to other requirements. BABOK 5.1 Trace Requirements. In our case, this lineage is clearly broken."}, {"n": "10", "q": "During the development of a mobile banking app, the project team initially agreed to include a feature that allows users to transfer money between accounts within the same bank. However, halfway through the project, the business stakeholders request a change: they now want to extend the feature to allow transfers between different banks. As a result, the project requirements need to be updated to reflect this new functionality.\n\nWhat is the correct order of steps to assess such a change?", "o": ["Assess the impact -> Understand the proposed change -> Update the baselines", "Understand the proposed change -> Assess the impact -> Update the baselines", "Update the baselines -> Understand the proposed change -> Assess the impact", "Understand the proposed change -> Update the baselines -> Assess the impact"], "k": 1, "e": "Understand the proposed change -> Assess the impact -> Update the baselines is the correct order. Refer to BABOK 5.4 Asses Requirements Change"}, {"n": "23", "q": "Bob, the Business Analyst, is working on a compliance project where the regulator requires the organization to produce 15 new reports by the deadline, or face hefty fines. Bob is concerned that not all reports can be completed on time and needs to prioritize them. What basis for prioritization should he use in this case?", "o": ["Cost", "Risk", "Penalty", "Time sensitivity"], "k": 2, "e": "Penalty: the consequences that result from not implementing a given requirement. This includes prioritizing requirements in order to meet regulatory or policy demands imposed on the organization. BABOK 5.3 Prioritize Requirements"}, {"n": "31", "q": "Pamela, the Project Manager, is concerned that the project will face many change requests, which could lead to inconsistent requirements. You reassure her that you will perform a specific business analysis task to ensure that requirements remain correct and current after any approved changes. What task is this?", "o": ["Approve requirements", "Assess Requirements Change", "Trace requirements", "Maintain requirements"], "k": 3, "e": "Requirements are maintained so that they remain correct and current after an approved change. Refer to BABOK 5.2 Maintain Requirements"}, {"n": "42", "q": "To simplify the prioritization of requirements, Sally, the Scrum Master, suggests using three imaginary baskets: high, medium, and low. She proposes sorting the requirements into these baskets and treating them accordingly. What type of prioritization is she using?", "o": ["Negotiation", "Ranking", "Time boxing", "Grouping"], "k": 3, "e": "Grouping consists of classifying business analysis information according to predefined categories such as high, medium, or low priority. BABOK 10.33 Prioritization"}, {"n": "45", "q": "Items are removed from the backlog when they are completed. However, removed items can be re-added to the backlog. What is a good reason to re-add an item to the backlog?", "o": ["The resulting work product might have defects", "The end users did not like the resulting work product as much as was anticipated", "The items are never re-added to the backlog", "The product got moved to another lifecycle stage, e.g. operations"], "k": 0, "e": "The removed items can be re-added to the backlog for a variety of reasons, including: <...> the resulting work product might have defects. BABOK 10.2 Backlog management"}, {"n": "52", "q": "When reviewing the list of identified dependencies for the project, you become concerned that not all of them may be resolved on time. You believe it would be wise to have a plan in case a particular dependency isn't resolved when needed. What do you need to define?", "o": ["An escalation matrix", "A project plan", "A dependency owner", "A dependency category"], "k": 0, "e": "Escalation Matrix: a level of escalation in case the item is not resolved by the given due date. BABOK 10.26 Item tracking"}, {"n": "54", "q": "What can give you a reliable assessment of which requirements have been addressed in the solution, and which have not?", "o": ["Prioritization", "Requirements architecture", "Allocation", "Traceability"], "k": 3, "e": "Traceability enables: <...> reliable assessment of which requirements have been addressed and which have not. Refer to BABOK 5.1 Trace requirements"}, {"n": "62", "q": "Ren, the Risk Manager, is maintaining a registry of project risks. At some point, he needs to reference specific risks from his registry in another document and realizes he can't do it. Which key element is likely missing from the registry?", "o": ["Type of risks", "Summary of a risk", "Unique identifier of the risk", "Owner of the risks"], "k": 2, "e": "Item Identifier: a unique identifier that distinguishes one item from another. BABOK 10.26 Item tracking"}, {"n": "80", "q": "You know the project has a risk register. Two project members are trying to refer to an item in the register. One is explaining the risk, while the other is trying to locate it in the list. Although they both seem to have found the record, you realize they are actually discussing different risks. Which attribute of risk item tracking is likely missing from the register?", "o": ["Risk category", "Risk identifier", "Risk summary", "Risk description"], "k": 1, "e": "\"Item Identifier: a unique identifier that distinguishes one item from another.\" If they had it, they could just compare the identifiers of the items they were discussing it would become obvious if they are talking about the same item or not. BABOK 10.26 Item Tracking"}, {"n": "87", "q": "In a software development project, the marketing team prioritizes features that enhance customer engagement, while the operations team focuses on features that improve system efficiency. You need to elicit requirements from both groups of stakeholders and run a holistic prioritization of the requirements. Based on this input, what can you anticipate about the upcoming prioritization session, where representatives from both teams will be present?", "o": ["Many requirements will be prioritized as low priority", "Unbiased prioritization will happen", "Conflicts may occur", "Solution will need to be re-designed"], "k": 2, "e": "Prioritization is an assessment of relative value. Each stakeholder may value something different. When this occurs, there may be conflict amongst stakeholders. BABOK 5.3 Prioritize Requirements"}, {"n": "91", "q": "Which one from the list is not a risk associated with running a collective prioritization process?", "o": ["It may facilitate consensus building and trade-offs", "The solution team may intentionally or unintentionally try to influence the result of the prioritization process by overestimating the difficulty or complexity of implementing certain requirements.", "The solution team may intentionally or unintentionally try to influence the result of the prioritization process by overestimating the difficulty or complexity of implementing certain requirements.", "Some stakeholders may attempt"], "k": 0, "e": "This is not a risk. In fact, this is the main benefit of a prioritization process. BABOK 10.33 Prioritization"}, {"n": "99", "q": "The business analysis team has prioritized the requirements based on expected business value. When the implementation team (engineers) picks up the project, they propose reordering requirements to simplify the implementation, promising to deliver the original scope in line with the original timeframes. As a business analyst, will you support this approach?", "o": ["No, ease of implementation is a bad basis for prioritization", "Yes, business priorities can not be relied on without technical analysis", "No, the business prioritization always take priority", "Yes, the basis for prioritization may change between different stages of the project."], "k": 3, "e": "The basis for prioritization may be different at various stages of the change. For example, stakeholders may initially prioritize based on benefits. The implementation team may then re-prioritize the requirements based on the sequence in which they must be implemented due to technical constraints. BABOK 5.3 Prioritize Requirements"}, {"n": "110", "q": "Which of the following types of requirements relationships is an example of a dependency relationship?", "o": ["Satisfy", "Necessity", "Derive", "Validate"], "k": 1, "e": "Types of dependency relationships include: Necessity <...> Effort. BABOK 5.1 Trace requirements"}, {"n": "113", "q": "You've just finished preparing a list of requirements that needs formal approval from several stakeholders. What is the best approach to reduce delays during the approval process?", "o": ["If the approvals are needed urgently, don't bother with wasting time with multiple stakeholders. Escalate the need of approval directly to the project sponsor.", "Send the requirements to each stakeholder individually, indicating that the other stakeholders have already approved and only their approval is pending. This will create a sense of urgency and encourage quicker approvals.", "Book an approval meeting and present requirements one by one requesting an immediate approval of each.", "Invite the stakeholder for preliminary requirements review, so they can ask questions and gain understanding of requirements prior to the approval date."], "k": 3, "e": "To maintain stakeholder support for the solution, consensus among stakeholders is usually sought prior to requesting approval of requirements. BABOK 5.5 Approve requirements"}, {"n": "116", "q": "Which type of requirements relationship will you use to link a functional requirement and a test case?", "o": ["Validate", "Depends", "Derive", "Satisfy"], "k": 0, "e": "Validate: relationship between a requirement and a test case or other element that can determine whether a solution fulfills the requirement. BABOK 5.1 Trace requirements"}, {"n": "119", "q": "The project you are working on is managed in a very formal manner, with clearly defined delivery phases and a list of documents expected at the end of each phase. As you approach the end of the Discovery phase, an approved requirements document is one of the expected artifacts. When presenting the requirements to Audrey, one of the key decision-makers, you receive verbal approval of the document. When you ask her if the same approval can be obtained in writing, she hesitates and tries to change the subject. What should you do?", "o": ["Insist on getting a written confirmation of an approval, otherwise the requirements will be treated as unapproved at the end of the phase", "Given her hesitation, suspect that something fishy is happening and report to HR", "Nothing, you received the approval from the key decision maker", "Do not push, she is clearly not confident with providing a written approval so to keep a good stakeholder relationship just accept a verbal approval"], "k": 0, "e": "The project is obviously delivered using a predictive approach, the one that is typically associated with higher degree of formality. In this case, you have to follow the process and insist on getting a formal approval that will allow you to comply with the expectations of the current phase of the project. Refer to BABOK 5.5 Approve requirements."}, {"n": "4", "q": "Which business analysis task helps define the requirements approval process?", "o": ["Prioritize requirements", "Plan business analysis approach", "Plan business analysis governance", "Approve requirements"], "k": 2, "e": "The approval process is defined by the task Plan Business Analysis Governance. BABOK 5.5 Approve requirements"}, {"n": "19", "q": "Out of 30 requirements in the backlog, only 17 have been approved in the requirements approval session. What is the best way to keep track of which requirements have been approved and which have not?", "o": ["Send out an email to stakeholders with the results of approvals", "Maintain a separate registry of approved requirements", "Keep a note in your business analysis documents", "Update a status of requirements to indicate which ones received approval"], "k": 3, "e": "The business analyst records approval decisions, possibly in requirements maintenance and tracking tools. In order to communicate the status of requirements, it is necessary to keep accurate records of current approval status. BABOK 5.5 Approve requirements"}, {"n": "24", "q": "The project you are working on has a formal change management process. Any proposed change must be presented at a steering committee, discussed, and unanimously accepted by the committee. As a business analyst, you serve as the entry point for change requests. One day, you receive a request from one of the stakeholders to amend the agreed-upon functionality of the solution. Upon quick analysis, you realize this change would conflict with the legal constraints imposed on the solution by legislation. What should you do?", "o": ["Keep a record of the request, mark it as impossible to implement, inform the requester and reach alignment in understanding of the reasons why the change is not possible. Do not bring it up at the steering committee.", "Prepare the presentation for the steering committee as the process demands. Make sure to include full impact assessment, including potential impact on all the related requirements and designs.", "Include it as a requirement in the backlog with a lower priority, so that it can be dealt with later.", "Disregard the request and do not bring it up again."], "k": 0, "e": "Business analysts will determine the formality of the assessment process based on the information available, the apparent importance of the change, and the governance process. Many proposed changes may be withdrawn from consideration or declined before any formal approval is required. BABOK 5.4 Assess Requirements Changes In our case, the request is straight impossible to implement due to legal reasons, so there is no point wasting time to prepare the full analysis; however it needs to be properly recorded and marked with the proper status and notes."}, {"n": "30", "q": "Which items from the list cannot be included in a backlog? A. Use cases B. Customer orders C. Change requests D. Planned rework", "o": ["B, D", "A, C", "All of them can be included", "A, B"], "k": 2, "e": "Backlog items may be any kind of item which may have work associated with it. BABOK 10.2 Backlog management"}, {"n": "32", "q": "Which of the strategies below are valid impact resolution strategies that a change assessment can result in? A. Approve change B. Deny change C. Reinvent change D. Improve change", "o": ["none", "A, C", "A, B", "A, B, C, D", "A, B, C"], "k": 2, "e": "Approve, Deny and Defer are possible impact resolution approaches. The rest are made up. BABOK 5.4 Assess Requirements Changes"}, {"n": "34", "q": "You receive a feature request from one of the stakeholders. The request seems valuable and reasonable, but you know that it is a new requirement that is not a priority for your team. You know that it is unlikely to be prioritized soon due to higher-priority work already planned for the quarter. What is the best action?", "o": ["Accept it to work as soon as you can to accommodate for stakeholder's needs", "Reject it", "Add it to the backlog so it can be discussed during backlog refinement and prioritisation", "Escalate the decision to the steering committee"], "k": 2, "e": "Backlog is the record of all work that is not done yet. New requests should be recorded there so they can be prioritised alongside other work items. Periodic review of the entire backlog should occur because changes in stakeholder needs and priorities may necessitate changes to the priority of some of the backlog items. BABOK 10.2 Backlog Management. This way answer 3 seems the best course of action."}, {"n": "40", "q": "Items can be removed from the backlog for two reasons. One of them is that the items are completed. What is the other potential reason?", "o": ["A decision is made to not do any work on those items", "Items can never be removed from a backlog", "Priorities change", "Items will be delivered by a different team member than originally planned (e.g., they need to be reassigned to a new responsible person)."], "k": 0, "e": "Items are removed from the backlog when they are completed, or if a decision has been made to not do any more work on them. BABOK 10.2 Backlog management"}, {"n": "44", "q": "Which type of requirements relationship will you use to link a functional requirement and a solution component that implements it?", "o": ["Depends", "Derive", "Validate", "Satisfy"], "k": 3, "e": "Satisfy: relationship between an implementation element and the requirements it is satisfying. For example, the relationship between a functional requirement and a solution component that is implementing it. BABOK 5.1 Trace requirements"}, {"n": "45", "q": "Why do we maintain requirements?", "o": ["Requirements are maintained so that emerging requirements risks are identified", "Requirements are maintained so that they remain correct and current after they are reused", "Requirements are maintained so that they remain correct and current after the solution is retired", "Requirements are maintained so that they remain correct and current after an approved change."], "k": 3, "e": "Requirements are maintained so that they remain correct and current after an approved change. Refer to BABOK 5.2 Maintain Requirements"}, {"n": "55", "q": "In a requirements prioritization meeting someone suggested to prioritize based on Risk. What does it mean?", "o": ["Requirements that are dependant on many other requirements will be addressed first to reduce the risk of delays", "Requirements that are least certain to deliver value or be possible to implement will be prioritized first to reduce the total amount of project risk quickly", "Requirements that are associated with a risk of penalties will be prioritized first", "Requirements that are less valuable will be addressed first"], "k": 1, "e": "Typical factors that influence prioritization include:<...> Risk: the chance that the requirement cannot deliver the potential value, or cannot be met at all. If there is a risk that the solution is not technically feasible, the requirement that is most difficult to implement may be prioritized to the top of the list in order to minimize the resources that are spent before learning that a proposed solution cannot be delivered. BABOK 5.3 Prioritize Requirements"}, {"n": "57", "q": "When new or changed requirements are identified, what happens to the backlog?", "o": ["The newly identified or changed requirements are added to the existing backlog and ordered relative to the other items already there", "The old requirements are replaced with the new ones", "A new backlog is created for the new requirements", "They are added to the existing backlog, at the bottom of the backlog"], "k": 0, "e": "When new or changed requirements are identified, they are added to the backlog and ordered relative to the other items already there. BABOK 10.2 Backlog management"}, {"n": "62", "q": "Estimation in story points in an example of which type of estimation?", "o": ["Weighted", "Relative", "Hybrid", "Absolute"], "k": 1, "e": "Relative Estimation - Team estimation techniques using either story points, which represent the relative complexity of a user story to develop, or ideal days, which represent the amount of total effort a story would take to develop. BABOK 11 The Agile Perspective"}, {"n": "64", "q": "Which even triggers the start of the requirements lifecycle management?", "o": ["When a formal project is kicked off", "When a backlog item is created in Jira", "When a business analyst is assigned to a project", "When a business need is expressed as a requirement"], "k": 3, "e": "The requirements life cycle begins with the representation of a business need as a requirement. BABOK 5 Requirements Life Cycle Management"}, {"n": "66", "q": "To prioritize requirements, you ask stakeholders to estimate the effort needed for implementation and select the requirements that can fit within the 30 available development days. Which requirements prioritization technique is this?", "o": ["Time boxing, also known as budgeting", "Grouping", "Ranking", "Negotiation"], "k": 0, "e": "Time boxing or budgeting prioritizes business analysis information based on the allocation of a fixed resource. BABOK 10.33 Prioritization"}, {"n": "78", "q": "After the requirements elicitation session, you end up with too many requirements to fit within the project budget. You want to ensure that only the requirements with the highest value to stakeholders are included in the solution. What do you need to do to decide which requirements should be implemented and which should be set aside?", "o": ["Prioritize requirements", "Allocate requirements", "Maintain requirements", "Approve requirements"], "k": 0, "e": "Prioritization is the act of ranking requirements to determine their relative importance to stakeholders. When a requirement is prioritized, it is given greater or lesser priority. Priority can refer to the relative value of a requirement, or to the sequence in which it will be implemented. BABOK 5.3 Prioritize Requirements"}, {"n": "86", "q": "As a Project Assistant, Annie is asked to manage lists of project actions, assumptions, risks, and dependencies. Which business analysis technique can help her?", "o": ["Backlog management", "Mind mapping", "Item tracking", "Data modeling"], "k": 2, "e": "Item tracking is an organized approach used by business analysts to address stakeholder concerns. Stakeholders may identify such item types as actions, assumptions, constraints, dependencies, defects, enhancements, and issues. BABOK 10.26 Item tracking"}, {"n": "98", "q": "Which type of requirements relationship is used when one requirement depends on another requirement?", "o": ["Satisfy", "Validate", "Derive", "Depends"], "k": 3, "e": "Depends: relationship between two requirements, used when a requirement depends on another requirement. BABOK 5.1 Trace requirements"}, {"n": "112", "q": "You have a security requirement to implement the login functionality and a separate list of requirements to maintaining a logged-in state for the application. There is clearly a relationship between the two. What type of relationship is this?", "o": ["Derive: one item is derived from another", "Satisfy: one of the items is an implementation of another", "Dependency -> Effort: it is easier to implement one requirement if another is also implemented", "Dependency -> Necessity: It only makes sense to implement a requirement if another one is also implemented"], "k": 3, "e": "Depends: relationship between two requirements, used when a requirement depends on another requirement. Types of dependency relationships include Necessity: when it only makes sense to implement a particular requirement if a related requirement is also implemented. BABOK 5.1 Trace Requirements. This is our case., we can't implement security requirements for login state if login functionality is not implemented."}];
var L="ABCDEFGH",submitted=false,ans={};
var list=document.getElementById("list");
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function render(){
  list.innerHTML="";
  Q.forEach(function(q,i){
    var c=document.createElement("div");c.className="card";c.id="c"+i;
    var h='<p class="qh">Câu '+(i+1)+'. '+esc(q.q)+'</p>';
    q.o.forEach(function(o,j){
      h+='<label id="l'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'"><span><b>'+L[j]+'.</b> '+esc(o)+'</span></label>';
    });
    h+='<div id="r'+i+'"></div>';
    c.innerHTML=h;list.appendChild(c);
    c.querySelectorAll("input").forEach(function(inp){
      inp.addEventListener("change",function(){ans[i]=+inp.value;update()});
    });
  });
  update();
}
function update(){
  var n=Object.keys(ans).length;
  document.getElementById("pb").style.width=(n/Q.length*100)+"%";
  document.getElementById("cnt").textContent="Đã chọn "+n+"/"+Q.length+" câu";
  document.getElementById("sub").disabled=submitted||n<Q.length;
  document.getElementById("hint").textContent=(!submitted&&n<Q.length)?"Còn "+(Q.length-n)+" câu chưa chọn":"";
}
document.getElementById("sub").onclick=function(){
  var right=0;submitted=true;
  Q.forEach(function(q,i){
    var c=document.getElementById("c"+i),ok=ans[i]===q.k;
    if(ok)right++;
    c.classList.add("locked",ok?"ok":"no");
    c.querySelectorAll("input").forEach(function(x){x.disabled=true});
    var lk=document.getElementById("l"+i+"_"+q.k);
    lk.classList.add("right");lk.insertAdjacentHTML("beforeend",'<span class="tag">Đáp án đúng</span>');
    if(!ok){var lw=document.getElementById("l"+i+"_"+ans[i]);lw.classList.add("wrong");lw.insertAdjacentHTML("beforeend",'<span class="tag">Bạn chọn</span>')}
    document.getElementById("r"+i).innerHTML='<div class="res">'+(ok?"✔ Đúng":"✘ Sai")+' — Đáp án: '+L[q.k]+'</div>'+(q.e?'<div class="exp">'+esc(q.e)+'</div>':"");
  });
  var s=document.getElementById("score");
  s.style.display="block";s.innerHTML='Kết quả<span>'+right+'/'+Q.length+'</span>câu đúng';
  document.getElementById("rst").style.display="";
  update();window.scrollTo({top:0,behavior:"smooth"});
};
document.getElementById("rst").onclick=function(){
  ans={};submitted=false;document.getElementById("score").style.display="none";
  this.style.display="none";render();window.scrollTo({top:0,behavior:"smooth"});
};
render();
</script></body></html>
