<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Business Analysis Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
    }
    .quiz-container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      margin-bottom: 20px;
    }
    .option {
      margin: 10px 0;
    }
    button {
      margin-top: 20px;
      padding: 10px 15px;
      background-color: #0078d7;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005a9e;
    }
    .result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h2>How do we call the act of transformation in response to a need?</h2>
    <form id="quizForm">
      <div class="option">
        <input type="radio" name="answer" value="A"> A. Context
      </div>
      <div class="option">
        <input type="radio" name="answer" value="B"> B. Change
      </div>
      <div class="option">
        <input type="radio" name="answer" value="C"> C. Solution
      </div>
      <div class="option">
        <input type="radio" name="answer" value="D"> D. Value
      </div>
      <button type="button" onclick="checkAnswer()">Submit</button>
    </form>
    <div class="result" id="result"></div>
  </div>

  <script>
    function checkAnswer() {
      const selected = document.querySelector('input[name="answer"]:checked');
      const resultDiv = document.getElementById('result');
      if (!selected) {
        resultDiv.textContent = "Please select an answer.";
        return;
      }
      if (selected.value === "B") {
        resultDiv.textContent = "✅ Correct! Change - The act of transformation in response to a need. (BABOK 2.1 Business Analysis Key Concepts)";
      } else {
        resultDiv.textContent = "❌ Incorrect. The correct answer is B. Change.";
      }
    }
  </script>
</body>
</html>
