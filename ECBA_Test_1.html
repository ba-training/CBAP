<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECBA Test 1</title>
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --text:#1d2433; --muted:#667085; --border:#e1e5ee;
  --primary:#3b5bdb; --primary-d:#2f49b3; --ok:#12805c; --ok-bg:#e6f6ef; --bad:#c92a2a; --bad-bg:#fdecec;
  --warn:#8a6100; --warn-bg:#fff6dd; --shadow:0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c; --card:#1b1f2a; --text:#e8ebf2; --muted:#9aa3b5; --border:#2b3141;
  --primary:#7b96ff; --primary-d:#9bb0ff; --ok:#4cd6a0; --ok-bg:#153528; --bad:#ff8787; --bad-bg:#3a1b1d;
  --warn:#ffd36b; --warn-bg:#3a2f12; --shadow:none;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px}
button:hover{border-color:var(--primary)}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
button.primary:hover{background:var(--primary-d)}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=text]{width:100%;font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin:8px 0 14px}
input[type=text]:focus{outline:2px solid var(--primary);border-color:transparent}
.hidden{display:none!important}
.saved-list{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{font-size:.9rem;padding:5px 12px;border-radius:999px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link{background:none;border:none;color:var(--primary);padding:0;text-decoration:underline}
.err{color:var(--bad);font-size:.9rem;min-height:1.3em;margin:-6px 0 8px}

.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.who{font-weight:600}
.q{padding:18px 20px}
.q .num{font-size:.8rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.04em}
.q .text{margin:4px 0 12px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer}
.opt:hover{border-color:var(--primary)}
.opt input{margin-top:5px;accent-color:var(--primary)}
.opt .l{font-weight:700;min-width:1.2em}
.opt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,transparent)}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--border)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt .tag{margin-left:auto;font-size:.8rem;font-weight:700;white-space:nowrap;padding-left:8px}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.clear{font-size:.85rem;margin-top:2px}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;font-size:.95rem}
.fb .verdict{font-weight:700;margin-bottom:4px}
.fb.ok{background:var(--ok-bg)} .fb.ok .verdict{color:var(--ok)}
.fb.bad{background:var(--bad-bg)} .fb.bad .verdict{color:var(--bad)}
.fb.skip{background:var(--warn-bg)} .fb.skip .verdict{color:var(--warn)}
.fb .expl{color:var(--text);opacity:.9;margin-top:6px}

.score{text-align:center}
.score .big{font-size:2.6rem;font-weight:800;line-height:1.1}
.score .pct{color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:10px 16px;z-index:5}
.bar .in{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .prog{margin-right:auto;font-size:.9rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:8px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;max-width:90vw}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <!-- Màn hình nhập tên -->
  <section id="start">
    <h1>ECBA – Bài kiểm tra 1</h1>
    <p class="sub">Vui lòng nhập tên trước khi bắt đầu làm bài.</p>
    <div class="card">
      <label for="nameInput"><strong>Họ và tên</strong></label>
      <input type="text" id="nameInput" placeholder="Ví dụ: Nguyễn Văn A" autocomplete="name" maxlength="80">
      <div class="err" id="nameErr"></div>
      <div id="savedBox" class="hidden">
        <div style="color:var(--muted);font-size:.9rem">Bài đã lưu trên máy này (bấm để tiếp tục):</div>
        <div class="saved-list" id="savedList"></div>
      </div>
      <div class="row">
        <button class="primary" id="startBtn">Bắt đầu / Làm tiếp</button>
        <button class="link" id="importBtn" type="button">Mở file tiến độ đã tải về…</button>
        <input type="file" id="importFile" accept=".json,application/json" class="hidden">
      </div>
    </div>
  </section>

  <!-- Màn hình làm bài -->
  <section id="quiz" class="hidden">
    <div class="topbar">
      <div>Người làm: <span class="who" id="who"></span></div>
      <button id="exitBtn">← Đổi người làm</button>
    </div>

    <div id="scoreCard" class="card score hidden">
      <div>Kết quả</div>
      <div class="big"><span id="scoreNum"></span></div>
      <div class="pct" id="scorePct"></div>
    </div>

    <div id="questions"></div>
  </section>
</div>

<div class="bar hidden" id="bar">
  <div class="in">
    <span class="prog" id="prog"></span>
    <button id="exportBtn" title="Tải file tiến độ về máy để mang sang thiết bị khác">Tải file tiến độ</button>
    <button id="saveBtn">💾 Lưu</button>
    <button id="submitBtn" class="primary">Nộp bài</button>
    <button id="resetBtn" class="hidden">Làm lại từ đầu</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const QUESTIONS = [
 {
  "q": "A business analyst is verifying the requirements for a new software system. The analyst is focusing on ensuring that the requirements and designs meet quality standards. What is the main purpose of this activity?",
  "options": [
   "To design new solutions for the business",
   "To rank requirements according to their importance",
   "To ensure that requirements and designs meet quality standards",
   "To identify problematic requirements during requirements communication"
  ],
  "answer": 2,
  "explanation": "In business analysis, the main purpose of verifying requirements is to ensure that the requirements and designs meet quality standards. This activity involves checking the requirements for completeness, consistency, clarity, and other quality criteria. By doing so, the business analyst can ensure that the requirements are of high quality and can be effectively used in the design and implementation of the solution."
 },
 {
  "q": "What happens when either the number of requirements or level of formality increase?",
  "options": [
   "More effort is needed to trace requirements.",
   "Rejecting requirements is likely to increase.",
   "Developing new requirements becomes difficult.",
   "More time is required to complete the project."
  ],
  "answer": 0,
  "explanation": "When the number of requirements or the level of formality increases, more effort is needed to trace and manage requirements, ensuring they align with business needs."
 },
 {
  "q": "A software development team is considering implementing a new automated tool to simplify their workflow. In the context of identifying improvement opportunities, what does 'Increase Efficiencies' refer to in this scenario?",
  "options": [
   "Automating or simplifying the work the team performs",
   "Hiring more staff to handle the increased workload",
   "Purchasing the most expensive tool to ensure the highest quality",
   "Providing the team with training on how to use the new tool"
  ],
  "answer": 0,
  "explanation": "In this context, 'Increase Efficiencies' refers to making the work process more efficient, either by automating certain tasks or by simplifying the tasks that the team needs to perform. By implementing a new tool that can automate or simplify their work, the team can increase their efficiency, thereby improving their productivity and reducing the time and effort required to complete their tasks."
 },
 {
  "q": "Your company is developing a new software application. As a business analyst, you are tasked with analyzing the potential value of this project. You decide to use functional decomposition. What is your main purpose for using this technique?",
  "options": [
   "To define the user interface for the software application",
   "To map the flow of information between systems",
   "To perform a cost-benefit analysis of the project",
   "To divide a large function into smaller, manageable parts"
  ],
  "answer": 3,
  "explanation": "Functional decomposition is a technique used in business analysis to break down a large function into smaller, manageable parts. This allows the analyst to better understand the function and its components, which can be particularly useful when trying to determine the potential value of a project. By understanding all of the components of a function, the analyst can more accurately estimate the resources needed for the project, which can help in the cost-benefit analysis."
 },
 {
  "q": "What is the purpose of comparing the results collected through elicitation activities?",
  "options": [
   "Validate sufficient information was collected",
   "Confirm that the information is consistent and accurately represented",
   "Classify and organize the results",
   "Ensure that information produced is recorded for later reference use"
  ],
  "answer": 1,
  "explanation": "Comparing the results collected through elicitation activities is done to ensure that the information is consistent, accurate, and aligned with stakeholder needs and expectations. It helps confirm the quality and reliability of the gathered information."
 },
 {
  "q": "Which of the following activities are performed during the requirements life cycle management phase?",
  "options": [
   "Prioritize Designs",
   "Elicit Requirements",
   "Maintain Attributes",
   "Trace Requirements"
  ],
  "answer": 3,
  "explanation": "One of the activities performed during the requirements life cycle management phase is tracing requirements. This involves tracking and managing changes to requirements throughout the project."
 },
 {
  "q": "Which behavioural characteristic enables the business analyst (BA) to establish credibility by ensuring that business analysis efforts meet the needs of the business?",
  "options": [
   "Ethics",
   "Personal Accountability",
   "Trustworthiness",
   "Adaptability"
  ],
  "answer": 1,
  "explanation": "Personal accountability ensures that the BA takes responsibility for their work, delivers on commitments, and ensures business analysis efforts meet business needs, thereby establishing credibility."
 },
 {
  "q": "You are a business analyst working on a new software development project. The project has a tight deadline and limited resources. You are in the process of prioritizing requirements. Which of the following is a challenge you are most likely to encounter?",
  "options": [
   "Difficulty in obtaining stakeholder consensus on the importance of requirements",
   "The ease of implementing requirements",
   "The limited availability of resources for implementation",
   "The abundance of regulatory constraints"
  ],
  "answer": 0,
  "explanation": "Prioritizing requirements is a complex process that involves various stakeholders. One of the main challenges is reaching consensus among stakeholders on the importance of each requirement. This is because different stakeholders may have different views on what is important based on their individual perspectives and interests. This can make it difficult to determine which requirements should be prioritized over others."
 },
 {
  "q": "If a stakeholder is looking to understand the logistics and scope of each of the elicitation activities, a business analyst (BA) would share the:",
  "options": [
   "elicitation results (unconfirmed).",
   "stakeholder engagement approach.",
   "elicitation activity plan.",
   "elicitation results (confirmed)."
  ],
  "answer": 2,
  "explanation": "To help a stakeholder understand the logistics and scope of elicitation activities, the business analyst would share the \"Elicitation Activity Plan.\" This plan outlines the activities to be conducted and provides details about how they will be executed."
 },
 {
  "q": "You are a business analyst working on a new software development project. The project manager has asked you to allocate the requirements to the appropriate solution components. What is the primary goal of this task?",
  "options": [
   "To identify additional capabilities",
   "To assign requirements to solution components",
   "To prioritize the requirements",
   "To trace the requirements"
  ],
  "answer": 1,
  "explanation": "The primary goal of requirements allocation is to assign requirements to solution components. This is a critical step in the requirements analysis and design definition process, as it ensures that each requirement is appropriately addressed in the solution design. It also helps to identify any gaps in the solution and to ensure that all necessary functionality is included in the final product."
 }
];

const STORE_KEY = 'ecba_test_1_progress_v1';
const LETTERS = 'ABCD';
let state = null;        // {name, answers:{idx:optIdx}, submitted, savedAt}
let dirty = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf = name => name.trim().toLowerCase().replace(/\s+/g, ' ');

/* ---------- Lưu / đọc ---------- */
function readAll(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ return {}; }
}
function writeAll(all){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(all)); return true; } catch(e){ return false; }
}
function saveProgress(silent){
  state.savedAt = new Date().toISOString();
  const all = readAll();
  all[keyOf(state.name)] = state;
  const ok = writeAll(all);
  if (ok){
    dirty = false;
    if (!silent) toast('Đã lưu lúc ' + new Date(state.savedAt).toLocaleTimeString('vi-VN'));
  } else {
    toast('Không lưu được trên trình duyệt này. Hãy dùng nút "Tải file tiến độ".');
  }
  return ok;
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- Màn hình bắt đầu ---------- */
function renderSaved(){
  const all = readAll(), names = Object.values(all);
  $('savedBox').classList.toggle('hidden', !names.length);
  $('savedList').innerHTML = '';
  names.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = s.name + (s.submitted ? ' ✓ đã nộp' : '');
    b.onclick = () => { $('nameInput').value = s.name; startQuiz(); };
    $('savedList').appendChild(b);
  });
}
function startQuiz(){
  const name = $('nameInput').value.trim().replace(/\s+/g, ' ');
  if (!name){ $('nameErr').textContent = 'Bạn cần nhập tên để bắt đầu.'; $('nameInput').focus(); return; }
  $('nameErr').textContent = '';
  const saved = readAll()[keyOf(name)];
  if (saved){ state = saved; state.name = name; toast('Đã khôi phục bài làm đã lưu'); }
  else state = {name, answers:{}, submitted:false, savedAt:null};
  dirty = false;
  showQuiz();
}
function showQuiz(){
  $('start').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  $('bar').classList.remove('hidden');
  $('who').textContent = state.name;
  renderQuestions();
  window.scrollTo(0, 0);
}
function leaveQuiz(){
  if (dirty && !confirm('Bạn có thay đổi chưa lưu. Rời đi mà không lưu?')) return;
  dirty = false; state = null;
  $('quiz').classList.add('hidden'); $('bar').classList.add('hidden'); $('start').classList.remove('hidden');
  $('nameInput').value = ''; renderSaved();
}

/* ---------- Hiển thị câu hỏi ---------- */
function renderQuestions(){
  const box = $('questions'); box.innerHTML = '';
  const done = state.submitted;
  QUESTIONS.forEach((q, i) => {
    const chosen = state.answers[i];
    const hasAns = chosen !== undefined;
    const isRight = hasAns && chosen === q.answer;
    const card = document.createElement('div');
    card.className = 'card q' + (done ? ' locked' : '');
    let html = `<div class="num">Câu ${i+1}</div><div class="text">${esc(q.q)}</div>`;
    q.options.forEach((o, j) => {
      let cls = 'opt', tag = '';
      if (done){
        if (j === q.answer){ cls += ' right'; tag = '✓ Đáp án đúng'; }
        else if (j === chosen){ cls += ' wrong'; tag = '✗ Bạn chọn'; }
        else if (false){}
        if (j === chosen && j === q.answer) tag = '✓ Bạn chọn đúng';
      } else if (j === chosen) cls += ' sel';
      html += `<label class="${cls}"><input type="radio" name="q${i}" value="${j}" ${j===chosen?'checked':''} ${done?'disabled':''}>
        <span class="l">${LETTERS[j]}.</span><span>${esc(o)}</span>${tag?`<span class="tag">${tag}</span>`:''}</label>`;
    });
    if (!done && hasAns) html += `<button class="link clear" data-clear="${i}">Bỏ chọn câu này</button>`;
    if (done){
      const cls = !hasAns ? 'skip' : isRight ? 'ok' : 'bad';
      const verdict = !hasAns ? 'Chưa trả lời' : isRight ? '✓ Đúng' : '✗ Sai';
      html += `<div class="fb ${cls}"><div class="verdict">${verdict}</div>
        <div>Đáp án đúng: <strong>${LETTERS[q.answer]}. ${esc(q.options[q.answer])}</strong></div>
        ${q.explanation?`<div class="expl">${esc(q.explanation)}</div>`:''}</div>`;
    }
    card.innerHTML = html;
    box.appendChild(card);
  });

  box.querySelectorAll('input[type=radio]').forEach(r => r.addEventListener('change', e => {
    const i = +e.target.name.slice(1);
    state.answers[i] = +e.target.value; dirty = true; renderQuestions(true);
  }));
  box.querySelectorAll('[data-clear]').forEach(b => b.addEventListener('click', () => {
    delete state.answers[+b.dataset.clear]; dirty = true; renderQuestions(true);
  }));
  updateBar();
}

function updateBar(){
  const n = Object.keys(state.answers).length, total = QUESTIONS.length;
  const done = state.submitted;
  $('prog').textContent = done ? 'Đã nộp bài' : `Đã trả lời ${n}/${total} câu`;
  $('submitBtn').classList.toggle('hidden', done);
  $('saveBtn').classList.toggle('hidden', done);
  $('resetBtn').classList.toggle('hidden', !done);
  $('scoreCard').classList.toggle('hidden', !done);
  if (done){
    const correct = QUESTIONS.filter((q, i) => state.answers[i] === q.answer).length;
    $('scoreNum').textContent = `${correct}/${total}`;
    $('scorePct').textContent = `Đúng ${correct} trên ${total} câu (${Math.round(correct/total*100)}%)`;
  }
}

/* ---------- Nộp bài ---------- */
function submitQuiz(){
  const missing = QUESTIONS.length - Object.keys(state.answers).length;
  const msg = missing
    ? `Bạn còn ${missing} câu chưa trả lời (sẽ tính là sai). Vẫn nộp bài?`
    : 'Nộp bài bây giờ? Sau khi nộp sẽ không sửa được đáp án.';
  if (!confirm(msg)) return;
  state.submitted = true;
  saveProgress(true);
  renderQuestions();
  window.scrollTo({top:0, behavior:'smooth'});
}
function resetQuiz(){
  if (!confirm('Xóa bài làm hiện tại và làm lại từ đầu?')) return;
  state.answers = {}; state.submitted = false; dirty = true;
  saveProgress(true);
  renderQuestions(); window.scrollTo(0, 0);
}

/* ---------- Xuất / nhập file tiến độ ---------- */
function exportProgress(){
  state.savedAt = new Date().toISOString();
  const blob = new Blob([JSON.stringify({app:'ecba_test_1', ...state}, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ecba-test-1_' + keyOf(state.name).replace(/[^\p{L}\p{N}]+/gu, '-') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importProgress(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || d.app !== 'ecba_test_1' || !d.name || typeof d.answers !== 'object') throw 0;
      state = {name:String(d.name), answers:d.answers, submitted:!!d.submitted, savedAt:d.savedAt || null};
      saveProgress(true); dirty = false; showQuiz(); toast('Đã mở file tiến độ');
    } catch(e){ $('nameErr').textContent = 'File không hợp lệ.'; }
  };
  r.readAsText(file);
}

/* ---------- Sự kiện ---------- */
$('startBtn').onclick = startQuiz;
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') startQuiz(); });
$('saveBtn').onclick = () => saveProgress(false);
$('submitBtn').onclick = submitQuiz;
$('resetBtn').onclick = resetQuiz;
$('exitBtn').onclick = leaveQuiz;
$('exportBtn').onclick = exportProgress;
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => { if (e.target.files[0]) importProgress(e.target.files[0]); e.target.value = ''; };
window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });

renderSaved();
</script>
</body>
</html>
